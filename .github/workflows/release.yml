name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build plugin release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Package plugin
        run: |
          mkdir -p caseboard
          cp main.js styles.css manifest.json versions.json caseboard/
          cd caseboard
          zip -r ../caseboard.zip .
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            caseboard.zip
            main.js
            styles.css
            manifest.json
            versions.json
